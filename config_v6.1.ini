# Enhanced YOLO Video Processing Configuration
# Version 6.1.0 - Camera Misalignment Detection (鏡頭歪斜偵測)

[PATHS]
model_path =  /Users/dimitrilin/Desktop/Project/EPS_PowerModule/CutSealant/models/yolo11s_20251223.pt

video_path = /Users/dimitrilin/Desktop/Project/EPS_PowerModule/CutSealant/videoData/2023-11-28_13_24_39.avi
validation_path = ./validation/
stack_light_path = LR6main.py

[VIDEO_SOURCE]
# 影片來源模式: 'camera', 'dfk_camera', 'video'
# - camera: 使用一般 USB/UVC 相機 (透過 OpenCV DirectShow)
# - dfk_camera: 使用 The Imaging Source (TIS) 工業相機 (如 DFK 33UX178)
# - video: 使用影片檔案
mode = video

# === 一般相機設定 (mode = camera) ===
camera_index = 0
camera_width = 4096
camera_height = 2160
camera_focus = 0
video_index = 0

# === TIS DFK 工業相機設定 (mode = dfk_camera) ===
# tisgrabber DLL 路徑 (需使用 x64 版本)
tis_dll_path = ./tisgrabber_x64.dll

# 相機名稱匹配字串 (用於自動搜尋相機)
# 範例: "DFK 33UX178", "DMK", "DFK" 等
tis_device_name = DFK 33UX178

# 或直接指定相機索引 (0-based)，若設定此項則忽略 tis_device_name
# 設為 -1 表示使用名稱匹配
tis_camera_index = -1

[YOLO_SETTINGS]
confidence_threshold = 0.8
iou_threshold = 0.45
max_detections = 100
use_half_precision = true
use_augmentation = false

[DETECTION_SETTINGS]
fps = 15
stop_threshold_seconds = 1
distance_threshold_pixels = 10
kmeans_clusters = 3
kmeans_rounds = 10

# === 檢測框閃動容忍機制 ===
# 物件消失容忍幀數：連續消失超過此幀數才視為真正離開
# 建議值: 3-10，較大值可容忍更多閃動但反應較慢
absent_tolerance_frames = 5

# RESULT_HOLD 最短保護時間（秒）：檢測完成後至少保持此時間不重置
# 建議值: 1.0-3.0，確保燈號狀態穩定
result_hold_min_seconds = 2.0

[DISPLAY_SETTINGS]
show_crosshair = true
show_timestamp = true
show_status = true
window_name = frame
auto_fit_screen = true
max_scale = 1.0
min_scale = 0.1

[DEVICE_SETTINGS]
device = cpu

[CLASSES]
carrier = 0
sealant = 1

[LOGGING_SETTINGS]
log_level = INFO
save_detection_log = true
log_file_path = ./logs/detection.log

[RECORDING_SETTINGS]
enable_recording = false
record_type = inference
output_path = ./recordings/
video_format = mp4
fps = 15
quality = medium

# === 24/7 監控模式設定 ===
#[MONITORING_SETTINGS]
# 心跳日誌間隔（秒）：每隔此時間記錄一次系統狀態
#heartbeat_interval = 60

# 閒置警告閾值（秒）：超過此時間無影格時發出警告
#idle_warning_threshold = 300

# 相機重連設定
#max_camera_reconnect_attempts = 5
#camera_reconnect_delay = 5

# === V6.0 人工複判設定 ===
[REJUDGE_SETTINGS]
# 審核視窗邊界 padding（像素）
review_window_padding = 50

# 審核視窗框線粗細（像素）
review_border_thickness = 3

# === V6.1.0 鏡頭歪斜偵測設定 ===
[CAMERA_HEALTH]
# ROI 定義（畫面比例，0.0 ~ 1.0）
# Carrier 靜止後，centroid 必須落在此矩形範圍內，否則判定鏡頭歪斜
# 原點為畫面左上角，roi_x_ratio / roi_y_ratio 為矩形左上角位置
# roi_w_ratio / roi_h_ratio 為矩形寬高
#
# 預設值為畫面中央 50%x50% 的區域：
#   roi_x_ratio=0.25, roi_y_ratio=0.25 → 左上角在 25% 位置
#   roi_w_ratio=0.50, roi_h_ratio=0.50 → 往右下延伸 50%
#
# 調整建議：在正常生產時觀察 carrier centroid 落點，
# 設定比實際落點範圍略大的 ROI（留 10-15% 餘裕）
roi_x_ratio = 0.25
roi_y_ratio = 0.25
roi_w_ratio = 0.50
roi_h_ratio = 0.50

# 警報閃爍間隔（秒）：每隔此時間切換顯示/隱藏
# 建議值: 0.3-1.0，預設 0.5 秒（每秒閃爍一次完整週期）
alert_blink_interval = 0.5

# 警報文字大小係數（相對畫面對角線比例）
# 公式: font_scale = (diagonal / 2203) * alert_font_scale_ratio * 25
# 建議值: 0.03-0.06，預設 0.04
alert_font_scale_ratio = 0.04

# 警報紅框粗細係數（相對畫面較短邊比例）
# 公式: thickness = max(1, int(min(dw, dh) * alert_border_thickness_ratio))
# 建議值: 0.008-0.020，預設 0.012
# 1920x1080 畫面下約為 13px，800x600 縮放畫面下約為 7px
alert_border_thickness_ratio = 0.012
